// ============================================================================
//  OVERLAY TELEPORT MAP - settings
//
//  Hold (or press - see HotkeyMode) an open key to bring up the overlay map,
//  move the cursor with the mouse, and click to teleport there.
//
//  Key values are Windows VIRTUAL-KEY CODES, not letters. A few useful ones:
//  220 = \ , 192 = ` , 32 = Spacebar, 46 = Delete, 33 = PageUp, 34 = PageDown,
//  13 = Enter. See the full list linked in the Readme.
// ============================================================================

[KEYS]
// These keys are FIXED and cannot be changed here. Listed so they are all in one place.
//   RIGHT MOUSE  - Reset the view: whole map, centred (undoes any zoom and panning).
//   MIDDLE MOUSE - Hold and move the mouse to pan the map (see PanSensitivity).
//   INSERT       - Snap the teleport cursor onto your current position.
//   BACKSPACE    - UNDO: go BACK to where you were before the last teleport.
//                  Press it again to return, so it hops between the two spots.
//   END          - Only if a teleport ever hangs, forces it through. You should never need it.

// Opens the overlay map. Default 192 = ` (backtick).
// If missing, falls back to 192.
OpenKey=192

// Hotkey behaviour.
// -1 = MAP ONLY. Hold to view, and teleporting is switched off completely -
//      clicking, the mission key and undo all do nothing. For using this as a
//      fast replacement for the pause map with no risk of a stray click
//      moving you.
// 0 = HOLD the open key to keep the map up.
// 1 = TOGGLE, press once to open and again to close.
// Toggle is easier when lining up a precise teleport, since you are already
// holding the middle mouse button to pan.
HotkeyMode=1

// Teleports to the MISSION / WAYPOINT marker (the yellow box) wherever it is -
// you do not aim this one.
// Default 32 = Spacebar. If missing, falls back to Spacebar.
// Needs MissionTeleport=1 in [OVERLAY].
MissionTeleportKey=32

[MAP]
// The map is always drawn centred on screen.
// MapCentreX / MapCentreY used to be settings here; they only did anything
// alongside a reduced MapSize, and off-centre layouts fought the cursor clamp,
// so the centre is now fixed.

// Height of the overlay map.
// 448.0 = full screen height (default and maximum).
// Lower it if you would rather the map did not cover the whole screen -
// it stays centred. MapAlpha is usually the better way to see the game behind
// it, and zoom the better way to place the cursor precisely.
MapSize=448.0

// Opacity of the overlay map, 0 to 255.
// Lower it to see more of the game behind.
MapAlpha=255

// World size of the game map. GTA Underground uses 48000.0.
// If this key is missing the mod falls back to 6000.0.
WorldSize=6000.0

[ZOOM]
// Zoom applied the first time the map opens each session.
// 1.0 = whole map is visible.
ZoomDefault=1.0

// Zoom multiplier per mouse-wheel notch.
// Higher = faster zoom. Must be greater than 1.0.
ZoomStep=1.25

// Minimum zoom.
// Keep at 1.0 so the whole map stays visible with no empty borders.
ZoomMin=1.0

// Maximum zoom.
// Higher = get closer, for more precise teleport placement.
ZoomMax=12.5

[CURSOR]
// Size of the teleport cursor.
CursorSize=10.0

// How fast the cursor moves with the mouse.
// Raise it for a faster cursor, lower it for finer placement.
CursorSensitivity=0.35

// How fast the map slides when you hold the MIDDLE MOUSE BUTTON.
// Separate from CursorSensitivity because dragging a map and nudging a cursor
// suit different speeds. Panning only does anything once you have zoomed in.
PanSensitivity=0.25

[OVERLAY]
// Display Radar blips on the overlay.
// 1 = draw the game's map blips on the overlay as well.
// 0 = off, which also skips loading the blip icons, so it is the faster setting.
ShowBlips=1

// Size of the blips drawn on the overlay.
// 1 (smallest) to 8 (largest), 4 is the default.
// Each step changes a blip by one screen unit, and icons, plain dots, height
// triangles and the mission marker all scale together so they keep their
// relative sizes. Missing or out of range falls back to 4.
BlipSize=4

// 1 = draw an arrow at your current position on the overlay (recommended).
ShowPlayerArrow=1

// 1 = show the world X/Y the cursor is currently over, i.e. exactly where
// clicking would put you.
// Handy for noting a spot down, or quoting it in a bug report.
ShowCoordinates=1

// 1 = highlight the active mission / waypoint marker on the overlay as a
// YELLOW BOX, and let MissionTeleportKey jump straight to it.
// Works whether ShowBlips is on or off.
MissionTeleport=1

// 0 = the overlay follows the pause map's blip LEGEND, so a category you
// switch off there (Locations, Contacts, Mission, Other) is hidden here too.
// 1 = show every category regardless.
// Worth setting to 1 if you use the legend to declutter the pause map for
// READING, since a category hidden for reading may be exactly the one you want
// to teleport to.
IgnoreMapLegend=0

// 1 = also draw map icons that belong to OTHER MODS - currently "More Radar
// Icons" and "Buy Property" by Junior_Djjr.
// Those mods add their icons through CLEO+ rather than through the game,
// which puts them somewhere the overlay cannot see.
// NEEDS THE HELPER SCRIPTS: OTM_BuyProperty_Helper.cs and / or
// OTM_MoreRadarIcons_Helper.cs. Without them this setting does nothing at all -
// it is not an error, there is simply nothing to draw.
// Also requires ShowBlips=1.
ShowModBlips=1

// 0 = hide blips in areas the player has not explored yet, exactly as the pause
// map does (those are the cloudy rectangles on it).
// 1 = show every blip everywhere - useful if you would rather use the mod to
// find places you have not been to.
// Only affects shops, properties, spray shops, races and the like;
// mission markers and your waypoint always show.
// Has no effect once you have explored most of the map.
ShowUnexploredBlips=0

[GAME]
// 1 = you stay in control while the map is open. While the map is up the
// mod hides the Fire and Aim inputs from the game, so the click that
// teleports will not shoot and the right click that resets the view will
// not raise your weapon.
// 0 = disable this feature.
PlayerCanMove=0

// Game speed while the map is open.
// 0.0 = frozen (default).
// 1.0 = normal speed.
GameSpeed=0.0

// 0 = hide the HUD while the map is open (recommended).
// 1 = keep showing the HUD.
ShowHUD=0

// 0 = hide the radar while the map is open (recommended).
// 1 = keep showing the Radar.
ShowRadar=0

// 0 = hide zone-name text while the map is open (recommended).
// 1 = keep showing the Zone Names.
ShowZoneNames=1

// 1 = allow teleporting to the bottom of water bodies.
// 0 = allow teleporting to the surface of water bodies.
IgnoreWater=0

// 1 = the train comes with you if you are driving one.
// 0 = you are removed from the train.
MoveTrain=1

[STATE]
// Written by the mod - no need to edit. Your last teleport position, so the map
// reopens with the cursor where you left it. 0.0 / 0.0 = map centre (first run).
LastTeleportX=0.0
LastTeleportY=0.0
